<!DOCTYPE html>
<html lang="en">
<head>
    <title>DOM Selectors</title>
</head>
<body>

    <h1 id="title" class="heading">JavaScript DOM</h1>

    <p class="text">Paragraph 1</p>
    <p class="text">Paragraph 2</p>
    <p class="text">Paragraph 3</p>

    <input type="text" name="username" value="Alex">

    <div id="container">
        <span class="item">Item 1</span>
        <span class="item">Item 2</span>
        <span class="item">Item 3</span>
    </div>

    <button id="btn">Click Me</button>

    <script>

        // getElementById()

        const title = document.getElementById("title");
        console.log(title);


        // getElementsByClassName()

        const text = document.getElementsByClassName("text");
        console.log(text);


        // getElementsByTagName()

        const paragraphs = document.getElementsByTagName("p");
        console.log(paragraphs);


        // getElementsByName()

        const username = document.getElementsByName("username");
        console.log(username);


        // querySelector()

        const firstText = document.querySelector(".text");
        console.log(firstText);


        // querySelector() with ID

        const heading = document.querySelector("#title");
        console.log(heading);


        // querySelector() with tag

        const paragraph = document.querySelector("p");
        console.log(paragraph);


        // querySelectorAll()

        const allText = document.querySelectorAll(".text");
        console.log(allText);


        // querySelectorAll() with tag

        const allParagraphs = document.querySelectorAll("p");
        console.log(allParagraphs);


        // querySelectorAll() with ID

        const titleList = document.querySelectorAll("#title");
        console.log(titleList);


        // Multiple selectors

        const elements = document.querySelectorAll("p, span");
        console.log(elements);


        // Descendant selector

        const items = document.querySelectorAll("#container .item");
        console.log(items);


        // Child selector

        const children = document.querySelectorAll("#container > .item");
        console.log(children);


        // Attribute selector

        const input = document.querySelector('[name="username"]');
        console.log(input);


        // NodeList

        const nodeList = document.querySelectorAll(".item");

        console.log(nodeList);
        console.log(nodeList.length);
        console.log(nodeList[0]);


        // NodeList with forEach()

        nodeList.forEach((element) => {
            console.log(element);
        });


        // NodeList with for loop

        for (let i = 0; i < nodeList.length; i++) {
            console.log(nodeList[i]);
        }


        // Convert NodeList to Array

        const nodeArray = Array.from(nodeList);
        console.log(nodeArray);


        // HTMLCollection

        const htmlCollection = document.getElementsByClassName("item");

        console.log(htmlCollection);
        console.log(htmlCollection.length);
        console.log(htmlCollection[0]);


        // HTMLCollection with for loop

        for (let i = 0; i < htmlCollection.length; i++) {
            console.log(htmlCollection[i]);
        }


        // Convert HTMLCollection to Array

        const htmlArray = Array.from(htmlCollection);
        console.log(htmlArray);


        // HTMLCollection to Array using Spread

        const spreadArray = [...htmlCollection];
        console.log(spreadArray);


        // Parent Element

        console.log(title.parentElement);


        // Children

        const container = document.getElementById("container");

        console.log(container.children);


        // First Child

        console.log(container.firstElementChild);


        // Last Child

        console.log(container.lastElementChild);


        // Next Sibling

        console.log(container.firstElementChild.nextElementSibling);


        // Previous Sibling

        console.log(container.lastElementChild.previousElementSibling);


        // closest()

        const item = document.querySelector(".item");

        console.log(item.closest("#container"));


        // matches()

        console.log(item.matches(".item"));
        console.log(item.matches(".text"));


        // contains()

        console.log(container.contains(item));


        // NodeList vs HTMLCollection

        console.log(nodeList instanceof NodeList);
        console.log(htmlCollection instanceof HTMLCollection);


        // Static NodeList

        const staticList = document.querySelectorAll(".item");

        const newItem = document.createElement("span");
        newItem.className = "item";
        newItem.textContent = "Item 4";

        container.appendChild(newItem);

        console.log(staticList.length);


        // Live HTMLCollection

        const liveCollection = document.getElementsByClassName("item");

        console.log(liveCollection.length);

    </script>

</body>
</html>
